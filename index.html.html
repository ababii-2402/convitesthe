<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tenho uma pergunta pra você 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffe9f0; --card:#fff7fa; --ink:#4a1f4d; --soft:#8a5a8c;
  --pink:#ff5c8a; --pink-ink:#ffffff; --butter:#ffe27a; --mint:#bfebd6; --line:#f3c3d4;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#2a1230; --card:#3a1d42; --ink:#ffe9f0; --soft:#d9a9d6;
    --pink:#ff7aa0; --pink-ink:#2a1230; --butter:#ffd95a; --mint:#7fcfae; --line:#5b3365;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#2a1230; --card:#3a1d42; --ink:#ffe9f0; --soft:#d9a9d6;
  --pink:#ff7aa0; --pink-ink:#2a1230; --butter:#ffd95a; --mint:#7fcfae; --line:#5b3365;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Nunito",system-ui,sans-serif; font-size:18px; line-height:1.5;
  display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px;
  overflow-x:hidden;
}
h1,h2,.btn,.opt b{font-family:"Fredoka","Nunito",system-ui,sans-serif}
main{width:100%;max-width:480px;text-align:center}
.screen{display:none}
.screen.on{display:block;animation:pop .35s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.big{font-size:84px;line-height:1;margin:0 0 8px;display:inline-block}
.wiggle{animation:wig 2.4s ease-in-out infinite}
.pic{display:block;width:200px;max-width:65%;height:auto;margin:0 auto 12px;border-radius:22px;border:3px solid var(--line)}
.hero{display:block;width:170px;max-width:60%;height:auto;margin:0 auto 8px}
@keyframes wig{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.06)}}
h1{font-size:clamp(34px,9vw,48px);line-height:1.1;margin:8px 0 12px;font-weight:700}
h2{font-size:clamp(26px,7vw,34px);line-height:1.15;margin:8px 0 8px;font-weight:600}
p{margin:0 0 20px;color:var(--soft)}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;min-height:64px}
.btn{
  font-size:22px;font-weight:600;border:0;border-radius:999px;padding:14px 34px;cursor:pointer;
  background:var(--pink);color:var(--pink-ink);transition:transform .15s;
}
.btn:hover{transform:scale(1.06)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 22px}
.opt{
  background:var(--card);border:3px solid var(--line);border-radius:22px;padding:16px 8px;
  cursor:pointer;color:var(--ink);font:inherit;transition:transform .15s,border-color .15s,background .15s;
}
.opt span{display:block;font-size:40px;line-height:1.2}
.opt b{display:block;font-size:19px;font-weight:600}
.opt small{display:block;color:var(--soft);font-size:14px}
.opt:hover{transform:translateY(-3px) rotate(-1deg)}
.opt[aria-pressed="true"]{border-color:var(--pink);background:var(--butter);color:#4a1f4d}
.opt[aria-pressed="true"] small{color:#6b3a6d}
.opts.days{grid-template-columns:1fr 1fr}
.ticket{
  background:var(--card);border:3px dashed var(--pink);border-radius:22px;
  padding:18px 20px;margin:0 0 22px;text-align:left;
}
.ticket div{padding:4px 0}
.ticket em{font-style:normal;color:var(--soft)}
.calbox{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:14px;margin:0 0 18px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calhead b{font-family:"Fredoka","Nunito",system-ui,sans-serif;font-size:20px;font-weight:600;text-transform:capitalize}
.nav{width:40px;height:40px;border-radius:50%;border:0;background:var(--bg);color:var(--ink);font-size:24px;line-height:1;cursor:pointer}
.nav:disabled{opacity:.3;cursor:not-allowed}
.wk,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wk span{font-size:13px;font-weight:700;color:var(--soft)}
.cell{aspect-ratio:1;border:0;border-radius:50%;background:transparent;color:var(--ink);font:inherit;font-size:16px;cursor:pointer;padding:0}
.cell:hover:not(:disabled){background:var(--butter);color:#4a1f4d}
.cell:disabled{opacity:.3;cursor:not-allowed}
.cell.today{box-shadow:inset 0 0 0 2px var(--pink)}
.cell[aria-pressed="true"]{background:var(--pink);color:var(--pink-ink);font-weight:700}
.lbl{margin:0 0 8px}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 22px}
.chip{border:3px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;font-weight:700;padding:10px 0;cursor:pointer}
.chip:hover{transform:translateY(-2px)}
.chip[aria-pressed="true"]{border-color:var(--pink);background:var(--butter);color:#4a1f4d}
.nav:focus-visible,.cell:focus-visible,.chip:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#no{transition:left .25s ease,top .25s ease}
#no.run{position:fixed;z-index:5}
.fall{position:fixed;top:-40px;font-size:28px;pointer-events:none;z-index:9;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){
  .wiggle,.screen.on{animation:none}
  .fall{display:none}
  #no{transition:none}
}
</style>
</head>

  $(id).classList.add("on");
  window.scrollTo(0,0);
}
$("hello").textContent = "Oi, " + CFG.ela + "!";

/* Botão "Não" que foge */
var tries = 0;
var hints = ["Ops.","Tenta de novo.","Ele não colabora.","Escapou de novo.","O Sim está logo ali.","Pode clicar no Sim."];
function dodge(e){
  if(e) e.preventDefault();
  var b = $("no"); tries++;
  b.classList.add("run");
  var w = b.offsetWidth, h = b.offsetHeight;
  var x = Math.random()*(window.innerWidth - w - 24) + 12;
  var y = Math.random()*(window.innerHeight - h - 24) + 12;
  b.style.left = x + "px"; b.style.top = y + "px";
  $("hint").textContent = hints[Math.min(tries-1, hints.length-1)];
  var yes = $("yes");
  yes.style.transform = "scale(" + Math.min(1 + tries*0.08, 1.6) + ")";
  if(tries >= 4) b.textContent = "Tá, Sim";
}
$("no").addEventListener("pointerenter", dodge);
$("no").addEventListener("pointerdown", dodge);
$("no").addEventListener("focus", dodge);
$("no").addEventListener("click", function(e){
  if(tries >= 4){ go2(); } else { dodge(e); }
});
$("yes").addEventListener("click", go2);
function go2(){ confetti(14); show("s2"); }

/* Opções de rolê */
function buildOpts(list, box, multi, onChange){
  list.forEach(function(o){
    var b = document.createElement("button");
    b.type = "button"; b.className = "opt"; b.setAttribute("aria-pressed","false");
    b.innerHTML = "<span aria-hidden='true'>" + o.e + "</span><b>" + o.t + "</b>" + (o.d ? "<small>" + o.d + "</small>" : "");
    b.addEventListener("click", function(){
      var on = b.getAttribute("aria-pressed") === "true";
      if(!multi){ box.querySelectorAll(".opt").forEach(function(x){x.setAttribute("aria-pressed","false")}); }
      b.setAttribute("aria-pressed", multi ? String(!on) : "true");
      onChange();
    });
    box.appendChild(b);
  });
}
buildOpts(PLACES, $("places"), true, function(){
  picks = [];
  $("places").querySelectorAll(".opt").forEach(function(x,i){
    if(x.getAttribute("aria-pressed")==="true") picks.push(PLACES[i].e + " " + PLACES[i].t);
  });
  $("next2").disabled = picks.length === 0;
});
var today = new Date(); today.setHours(0,0,0,0);
var view = new Date(today.getFullYear(), today.getMonth(), 1);
function sync(){ $("next3").disabled = !(picked && time); }
function renderCal(){
  var grid = $("cal"); grid.innerHTML = "";
  var y = view.getFullYear(), m = view.getMonth();
  $("mlabel").textContent = view.toLocaleDateString("pt-BR", {month:"long", year:"numeric"});
  $("prev").disabled = (y === today.getFullYear() && m === today.getMonth());
  var first = new Date(y, m, 1).getDay();
  var n = new Date(y, m + 1, 0).getDate();
  for(var i = 0; i < first; i++){ grid.appendChild(document.createElement("span")); }
  for(var d = 1; d <= n; d++){
    (function(d){
      var dt = new Date(y, m, d);
      var b = document.createElement("button");
      b.type = "button"; b.className = "cell"; b.textContent = d;
      b.disabled = dt < today;
      if(dt.getTime() === today.getTime()) b.classList.add("today");
      if(picked && dt.getTime() === picked.getTime()) b.setAttribute("aria-pressed", "true");
      b.addEventListener("click", function(){
        picked = dt;
        dayLabel = dt.toLocaleDateString("pt-BR", {weekday:"long", day:"numeric", month:"long"});
        renderCal(); sync();
      });
      grid.appendChild(b);
    })(d);
  }
}
$("prev").addEventListener("click", function(){ view = new Date(view.getFullYear(), view.getMonth() - 1, 1); renderCal(); });
$("next").addEventListener("click", function(){ view = new Date(view.getFullYear(), view.getMonth() + 1, 1); renderCal(); });
TIMES.forEach(function(t){
  var b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.setAttribute("aria-pressed", "false"); b.textContent = t;
  b.addEventListener("click", function(){
    $("times").querySelectorAll(".chip").forEach(function(x){ x.setAttribute("aria-pressed", "false"); });
    b.setAttribute("aria-pressed", "true"); time = t; sync();
  });
  $("times").appendChild(b);
});
renderCal();
$("next2").addEventListener("click", function(){ show("s3"); });
$("next3").addEventListener("click", function(){
  var t = $("ticket");
  t.innerHTML = "";
  [["Rolê", picks.join(", ")],["Dia", dayLabel],["Horário", time],["Com", CFG.eu]].forEach(function(r){
    var d = document.createElement("div");
    var em = document.createElement("em"); em.textContent = r[0] + ": ";
    d.appendChild(em); d.appendChild(document.createTextNode(r[1]));
    t.appendChild(d);
  });
  confetti(40); show("s4");
});

/* Mandar resposta */
$("send").addEventListener("click", function(){
  var msg = "Oi " + CFG.eu + "! Aceito o convite 😊\nRolê: " + picks.join(", ") + "\nDia: " + dayLabel + " às " + time;
  var url = "https://wa.me/" + CFG.zap + "?text=" + encodeURIComponent(msg);
  window.open(url, "_blank");
  $("sent").textContent = "Abrindo o WhatsApp. É só enviar a mensagem.";
});

/* Confete de emoji */
function confetti(n){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var set = ["💖","✨","🌸","💌","🍓","🎀"];
  for(var i=0;i<n;i++){
    var s = document.createElement("span");
    s.className = "fall"; s.textContent = set[i % set.length];
    s.style.left = Math.random()*100 + "vw";
    s.style.animationDuration = (2.5 + Math.random()*2.5) + "s";
    s.style.animationDelay = (Math.random()*0.6) + "s";
    document.body.appendChild(s);
    setTimeout(function(el){ el.remove(); }, 6500, s);
  }
}
